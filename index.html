<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 AI Prompt 智能寶庫</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0070f3',
                            600: '#0061d5',
                            700: '#0051b3',
                        },
                        purpleBrand: '#9333ea'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }
        /* Custom Scrollbar for Prompt Text Area */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .line-clamp-custom {
            display: -webkit-box;
            -webkit-line-clamp: 10;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 pb-16">

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 ease-out bg-slate-800 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-slate-700">
        <i class="fa-solid fa-circle-check text-green-400 text-lg" id="toast-icon"></i>
        <span id="toast-message" class="text-sm font-medium">已成功複製 Prompt 到剪貼簿！</span>
    </div>

    <!-- Edit/View Modal -->
    <div id="modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden border border-slate-800 transform transition-all scale-95 opacity-0" id="modal-content">
            <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
                <div class="flex items-center space-x-2">
                    <span id="modal-category" class="px-3 py-1 bg-sky-950 text-sky-400 font-semibold text-xs rounded-full border border-sky-800/50">分類</span>
                    <h3 id="modal-title" class="text-lg font-bold text-slate-100">Prompt 標題</h3>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 p-2 rounded-lg hover:bg-slate-800 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Prompt 完整內容</label>
                    <div id="modal-prompt-text" class="w-full p-4 bg-slate-950 rounded-xl border border-slate-800 text-slate-200 font-mono text-sm leading-relaxed whitespace-pre-wrap select-text"></div>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-800 bg-slate-900/50 flex items-center justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-slate-300 hover:bg-slate-800 font-medium text-sm transition">關閉</button>
                <button id="modal-copy-btn" onclick="" class="px-5 py-2 bg-brand-500 hover:bg-brand-600 text-white font-medium text-sm rounded-xl shadow-md transition flex items-center space-x-2">
                    <i class="fa-regular fa-copy"></i>
                    <span>複製 Prompt</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Sheet Settings Modal -->
    <div id="sheet-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-800">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-table text-green-500"></i> Google Sheet 連動設定
                </h3>
                <button onclick="closeSheetModal()" class="text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <p class="text-xs text-slate-400 mb-4">請確保 Google 試算表已開啟「知道連結的人皆可檢視」權限，或貼上公佈至網路的 CSV 連結。</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Google Sheet 網址 / CSV 連結</label>
                    <input type="text" id="sheet-url-input" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 text-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="https://docs.google.com/spreadsheets/d/...">
                </div>
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-slate-400">
                    <strong>提示：</strong>目前連結包含 Google Sheet 標識符 <code class="text-sky-400">1kXu0_qATmXv5fu-hw6lWgnnlOPwnVoHLilCDQGwu6Yk</code>。
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button onclick="resetToDefaultData()" class="px-4 py-2 text-slate-400 text-sm hover:bg-slate-800 rounded-xl font-medium">重置為預設資料</button>
                <button onclick="syncGoogleSheet()" class="px-5 py-2 bg-brand-500 hover:bg-brand-600 text-white font-medium text-sm rounded-xl shadow">連動更新</button>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">

        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight flex items-center justify-center gap-3">
                <span>🚀</span> AI Prompt 智能寶庫
            </h1>
            <div class="mt-3 flex items-center justify-center space-x-3 text-sm text-slate-400">
                <button onclick="openSheetModal()" class="inline-flex items-center space-x-1.5 hover:text-brand-500 transition font-medium bg-slate-900 px-3 py-1.5 rounded-full shadow-sm border border-slate-800 text-slate-300 hover:border-slate-700">
                    <i class="fa-solid fa-table-cells text-green-500"></i>
                    <span>開啟原始資料 Google Sheet</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-1"></i>
                </button>
                <span id="data-status-tag" class="px-2.5 py-1 bg-emerald-950/80 text-emerald-400 border border-emerald-800/60 text-xs font-semibold rounded-full flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    已連動 (8 筆 Prompts)
                </span>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="max-w-xl mx-auto mb-6">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <input type="text" id="search-input" oninput="handleSearch()" class="w-full pl-11 pr-4 py-3 bg-slate-900 border border-slate-800 text-white rounded-full shadow-lg text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition" placeholder="搜尋提示詞...">
            </div>
        </div>

        <!-- Filter Tags -->
        <div class="flex flex-wrap justify-center gap-2 mb-10 max-w-4xl mx-auto" id="category-tags-container">
            <!-- Dynamic Category Tags -->
        </div>

        <!-- Section Header -->
        <div class="flex items-center space-x-2 mb-6">
            <span class="text-2xl">🧠</span>
            <h2 class="text-xl font-bold text-white" id="section-title">AI 協思</h2>
            <span class="text-xs text-slate-500 font-medium" id="card-count-badge">(8)</span>
        </div>

        <!-- Prompt Cards Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="cards-container">
            <!-- Dynamic Prompt Cards -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-16 bg-slate-900 rounded-3xl border border-dashed border-slate-800">
            <i class="fa-regular fa-folder-open text-4xl text-slate-600 mb-3"></i>
            <p class="text-slate-400 font-medium">找不到相符的 Prompt 提示詞</p>
            <button onclick="resetFilters()" class="mt-3 text-sm text-brand-500 hover:underline">重置搜尋條件</button>
        </div>

    </div>

    <!-- Application Script -->
    <script>
        // Google Sheet default link
        const SPREADSHEET_URL = "https://docs.google.com/spreadsheets/d/1kXu0_qATmXv5fu-hw6lWgnnlOPwnVoHLilCDQGwu6Yk/edit?gid=1480282197#gid=1480282197";
        
        // Initial Mock Data corresponding to user's screenshot
        const initialPrompts = [
            {
                id: 1,
                category: "內容創作",
                title: "意義單詞",
                prompt: "將文章的重點部分，尋找一個代表性英文字母，並使這些字母的首字組合成一個具有意義的單詞（如「VISION」）"
            },
            {
                id: 2,
                category: "內容創作",
                title: "品牌名稱",
                prompt: `完成 ChatGPT 角色定義後，依據"品牌定義"與"產品介紹"發想5個產品名稱與標題（口號）。
    - 提示詞指令：描述品牌與產品，請列出 數字 個產品名稱與行銷標題建議。(*品牌定義*描述、*產品介紹*描述)
    - Prompt
        - 我推出一個運動鞋品牌，今年會銷售一款新型跑步`
            },
            {
                id: 3,
                category: "筆記精煉",
                title: "長篇文章",
                prompt: `為這篇長篇文章，進行以下四個步驟，每一個步驟都要提供給文章與標示出來：
第1、請為這篇文章生成一份簡短摘要。
第2、請基於上一份摘要，不要遺漏任何專有名詞、數字或關鍵人物，重新生成一份摘要。
第3、現在，請將摘要中每一句話都濃縮成更簡潔的表達，同時保留`
            },
            {
                id: 4,
                category: "筆記精煉",
                title: "書籍精煉",
                prompt: `請對 @[檔名]
啟動【終極煉金管線】，一次執行四步驟整合：
第一步：全域架構導航 (Stage 01)
執行 stage-1-navigator，對精煉稿進行深度掃描，產出知識地圖與反直覺預警。
存檔：01_Map_[主題簡稱].md。
第二步：價值 DNA 診斷 (Stage 02)`
            },
            {
                id: 5,
                category: "筆記精煉",
                title: "書籍精煉",
                prompt: `我剛讀完了關於 [填入具體段落標題] 的內容。現在請幫我進行深度研磨：

1-底層邏輯持續：針對這段內容的「運作原理」向我提問，測試我是否理解了「為什麼有效」，而非只是記住步驟。

2-心智優化：如果這段概念有極`
            },
            {
                id: 6,
                category: "筆記精煉",
                title: "提取練習",
                prompt: `我剛讀完了關於 [填入具體段落標題] 的內容。現在請幫我進行深度研磨：

1-底層邏輯持續：針對這段內容的「運作原理」向我提問，測試我是否理解了「為什麼有效」，而非只是記住步驟。

2-驗證優化：如果這段概念在每`
            },
            {
                id: 7,
                category: "內容創作",
                title: "影片清理",
                prompt: `你的角色是一位「逐字稿校對員」，不是編輯。
任務：
1-僅刪除口語填充詞、重複說法、明顯贅詞
2-不得改寫句型、不得改變原意、不得加入新解釋
規則：
1-原句順序必須完全一致
2-若刪除任何詞語，需確保前後文呈現`
            },
            {
                id: 8,
                category: "內容創作",
                title: "影片清理",
                prompt: `你的角色是一位「內容結構化整理員」，不是編輯、不是評論者。

我會提供一段約 4000 字的影片逐字稿內容，請你在完全保留原作者語意與立場的前提下，
進行「保留意思的濃縮」，將內容壓縮至 約 2000 字。全文用繁體中文呈現。`
            }
        ];

        // All available categories as shown in screenshot
        const allCategories = [
            "全部", "內容創作", "筆記精煉", "程式應用", "簡報表達", 
            "程式生成", "文本優化", "生文校正", "專案企劃", 
            "圖片生成", "筆記整理", "資訊整理", "心智圖法"
        ];

        // Application State
        let currentPrompts = [...initialPrompts];
        let activeCategory = "全部";
        let searchQuery = "";

        // Initialization
        window.onload = function() {
            renderCategoryTags();
            renderCards();
        };

        // Render Category Filter Buttons
        function renderCategoryTags() {
            const container = document.getElementById('category-tags-container');
            container.innerHTML = allCategories.map(cat => {
                const isActive = cat === activeCategory;
                const activeClasses = isActive 
                    ? 'bg-brand-500 text-white shadow-md font-semibold border-brand-500' 
                    : 'bg-slate-900 text-slate-300 hover:bg-slate-800 border-slate-800 font-medium';
                return `<button onclick="setCategory('${cat}')" class="px-4 py-2 rounded-full text-xs transition-all duration-200 cursor-pointer border ${activeClasses}">${cat}</button>`;
            }).join('');
        }

        // Set Active Category
        function setCategory(cat) {
            activeCategory = cat;
            renderCategoryTags();
            renderCards();
        }

        // Handle Search Input
        function handleSearch() {
            searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
            renderCards();
        }

        // Reset Filters
        function resetFilters() {
            activeCategory = "全部";
            searchQuery = "";
            document.getElementById('search-input').value = "";
            renderCategoryTags();
            renderCards();
        }

        // Render Cards Matrix
        function renderCards() {
            const container = document.getElementById('cards-container');
            const emptyState = document.getElementById('empty-state');
            const countBadge = document.getElementById('card-count-badge');

            // Filter logic
            const filtered = currentPrompts.filter(item => {
                const matchesCategory = (activeCategory === "全部") || (item.category === activeCategory);
                const matchesSearch = searchQuery === "" || 
                    item.title.toLowerCase().includes(searchQuery) || 
                    item.prompt.toLowerCase().includes(searchQuery) ||
                    item.category.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            countBadge.innerText = `(${filtered.length})`;

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = filtered.map(item => `
                <div class="bg-slate-900 rounded-2xl border border-slate-800 border-t-4 border-t-purple-500 shadow-xl hover:shadow-2xl transition-all duration-200 flex flex-col justify-between overflow-hidden group">
                    <div class="p-5 flex-1 flex flex-col">
                        <!-- Category Tag -->
                        <div class="mb-2">
                            <span class="inline-block px-2.5 py-0.5 bg-sky-950/80 text-sky-400 font-semibold text-[11px] rounded-md border border-sky-800/50">
                                ${escapeHtml(item.category)}
                            </span>
                        </div>
                        
                        <!-- Title -->
                        <h3 class="text-base font-bold text-slate-100 mb-3 group-hover:text-brand-500 transition-colors">
                            ${escapeHtml(item.title)}
                        </h3>
                        
                        <!-- Text Display Area -->
                        <div onclick="openModal(${item.id})" class="bg-slate-950 border border-slate-800/80 rounded-xl p-3.5 text-xs text-slate-300 leading-relaxed font-mono flex-1 custom-scrollbar overflow-y-auto max-h-[160px] cursor-pointer hover:bg-slate-950/60 transition">
                            ${escapeHtml(item.prompt)}
                        </div>
                    </div>
                    
                    <!-- Action Button -->
                    <div class="px-5 pb-5 pt-1">
                        <button onclick="copyPrompt('${encodeURIComponent(item.prompt)}')" class="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-white font-medium text-xs rounded-xl shadow-sm hover:shadow transition flex items-center justify-center space-x-1.5 active:scale-[0.98]">
                            <span>複製 Prompt</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Copy Prompt Functionality
        function copyPrompt(encodedText) {
            const text = decodeURIComponent(encodedText);
            
            // Clipboard Fallback Strategy
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast("已成功複製 Prompt 到剪貼簿！");
                }).catch(() => {
                    fallbackCopyTextToClipboard(text);
                });
            } else {
                fallbackCopyTextToClipboard(text);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("已成功複製 Prompt 到剪貼簿！");
            } catch (err) {
                showToast("複製失敗，請手動複製", true);
            }
            document.body.removeChild(textArea);
        }

        // Toast Notification System
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.innerText = message;
            if (isError) {
                toastIcon.className = "fa-solid fa-circle-exclamation text-red-400 text-lg";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-green-400 text-lg";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Modal Controls
        function openModal(id) {
            const item = currentPrompts.find(p => p.id === id);
            if (!item) return;

            document.getElementById('modal-category').innerText = item.category;
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-prompt-text').innerText = item.prompt;
            document.getElementById('modal-copy-btn').onclick = () => copyPrompt(encodeURIComponent(item.prompt));

            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        // Sheet Modal Controls
        function openSheetModal() {
            document.getElementById('sheet-url-input').value = SPREADSHEET_URL;
            document.getElementById('sheet-modal').classList.remove('hidden');
        }

        function closeSheetModal() {
            document.getElementById('sheet-modal').classList.add('hidden');
        }

        // Sync with Google Sheet CSV Functionality
        function syncGoogleSheet() {
            const urlInput = document.getElementById('sheet-url-input').value.trim();
            if (!urlInput) {
                showToast("請輸入有效的 Google Sheet 網址", true);
                return;
            }

            // Transform sheet URL to CSV export URL if standard sheet link
            let csvUrl = urlInput;
            const match = urlInput.match(/\/d\/([a-zA-Z0-9-_]+)/);
            if (match && match[1]) {
                const sheetId = match[1];
                const gidMatch = urlInput.match(/gid=([0-9]+)/);
                const gid = gidMatch ? gidMatch[1] : '0';
                csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;
            }

            showToast("正在同步最新 Google Sheet 資料...");
            fetch(csvUrl)
                .then(res => {
                    if (!res.ok) throw new Error("無法讀取試算表資料，請確認分享權限！");
                    return res.text();
                })
                .then(csvText => {
                    const parsedData = parseCSV(csvText);
                    if (parsedData.length > 0) {
                        currentPrompts = parsedData;
                        renderCards();
                        closeSheetModal();
                        document.getElementById('data-status-tag').innerHTML = `
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            已連動 Google Sheet (${currentPrompts.length} 筆)
                        `;
                        showToast(`成功同步 ${parsedData.length} 筆 Prompt 資料！`);
                    } else {
                        showToast("試算表解析為空或欄位不符", true);
                    }
                })
                .catch(err => {
                    console.warn("Spreadsheet Sync Error:", err);
                    showToast("Google Sheet 試算表目前設定私有。已載入頁面連動機制！", true);
                });
        }

        // Simple CSV Parser
        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length < 2) return [];

            const results = [];
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (row.length >= 2) {
                    const cat = row[0] ? row[0].replace(/^"|"$/g, '').trim() : "通用";
                    const title = row[1] ? row[1].replace(/^"|"$/g, '').trim() : "Prompt";
                    const prompt = row[2] ? row[2].replace(/^"|"$/g, '').trim() : (row[1] || "");
                    results.push({
                        id: i,
                        category: cat,
                        title: title,
                        prompt: prompt
                    });
                }
            }
            return results;
        }

        function resetToDefaultData() {
            currentPrompts = [...initialPrompts];
            renderCards();
            closeSheetModal();
            document.getElementById('data-status-tag').innerHTML = `
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                已連動 (8 筆 Prompts)
            `;
            showToast("已重置為標準資料庫！");
        }

        // Helper Utility
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
